
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Student Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        nav {
            background: #0f172a;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .brand {
            font-size: 26px;
            font-weight: bold;
        }

        .brand span {
            color: #60a5fa;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border-left: 5px solid #2563eb;
        }

        .stat h2 {
            font-size: 32px;
            margin: 10px 0 0;
        }

        .stat p {
            margin: 0;
            color: #64748b;
        }

        .btn {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-green {
            background: #16a34a;
        }

        .btn-red {
            background: #dc2626;
        }

        .btn-gray {
            background: #64748b;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            margin-top: 6px;
            font-size: 15px;
        }

        label {
            font-weight: bold;
        }

        .form-box {
            max-width: 500px;
            margin: 40px auto;
        }

        .task {
            border-bottom: 1px solid #e2e8f0;
            padding: 20px 0;
        }

        .task:last-child {
            border-bottom: none;
        }

        .task-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .priority {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .High {
            background: #fee2e2;
            color: #b91c1c;
        }

        .Medium {
            background: #fef3c7;
            color: #92400e;
        }

        .Low {
            background: #dcfce7;
            color: #166534;
        }

        .completed {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .muted {
            color: #64748b;
        }

        .errorlist {
            color: #dc2626;
        }

        .helptext {
            font-size: 12px;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                margin-top: 20px;
            }
        }
        .welcome-section {
            margin-bottom: 30px;
        }

        .eyebrow {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #2563eb;
        }

        .welcome-section h1 {
            margin: 12px 0;
            font-size: 32px;
        }

        .stats {
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .stat {
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .stat-icon {
            display: block;
            font-size: 25px;
            margin-bottom: 15px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .progress-track {
            height: 12px;
            width: 100%;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(
                90deg, #2563eb, #16a34a
            );
            border-radius: 20px;
            transition: width 0.4s ease;
        }

        .search-form {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .search-form input {
            flex: 1;
            margin: 0;
        }

        .search-form select {
            width: 160px;
            margin: 0;
        }

        .task {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .task:last-child {
            border-bottom: 1px solid #e2e8f0;
        }

        .task h3 {
            margin: 0;
        }

        .status-completed,
        .status-pending,
        .status-overdue {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-completed {
            color: #166534;
            background: #dcfce7;
        }

        .status-pending {
            color: #92400e;
            background: #fef3c7;
        }

        .status-overdue {
            color: #b91c1c;
            background: #fee2e2;
        }

        .empty-state {
            text-align: center;
            padding: 35px;
        }

        @media (max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .search-form {
                flex-wrap: wrap;
            }

            .search-form input,
            .search-form select {
                width: 100%;
                flex: auto;
            }

            .welcome-section h1 {
                font-size: 25px;
            }
        }

    </style>
</head>

<body>

    <nav>
        <a class="brand" href="{% url 'dashboard' %}">
            Task<span>Flow</span>
        </a>

        <div class="nav-links">
            {% if user.is_authenticated %}

                <span>Hello, {{ user.username }}</span>

                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-gray" type="submit">
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>

            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        TaskFlow | Student Task Management System
    </footer>

</body>
</html>
